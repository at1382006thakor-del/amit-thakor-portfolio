  <text x="420" y="185" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">Monthly Revenue Trend Line</text>
  <path d="M 430 340 Q 480 300, 520 310 T 600 240 T 690 210" fill="none" stroke="#38bdf8" stroke-width="3"/>
