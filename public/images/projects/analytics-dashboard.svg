  <!-- Pie chart visual -->
  <rect x="80" y="160" width="300" height="230" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="100" y="185" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f59e0b">Category Share Breakdown</text>
  <circle cx="230" cy="275" r="70" fill="none" stroke="#f59e0b" stroke-width="25" stroke-dasharray="180 300"/>
  <circle cx="230" cy="275" r="70" fill="none" stroke="#3b82f6" stroke-width="25" stroke-dasharray="120 300" stroke-dashoffset="-180"/>
  <circle cx="230" cy="275" r="70" fill="none" stroke="#10b981" stroke-width="25" stroke-dasharray="80 300" stroke-dashoffset="-300"/>

  <!-- Trend Line visual -->
