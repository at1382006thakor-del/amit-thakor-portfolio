  </defs>

  <rect width="800" height="450" fill="url(#dbBg)"/>
  
  <rect x="60" y="40" width="680" height="370" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="url(#pbiGrad)" stroke-width="1.5"/>
