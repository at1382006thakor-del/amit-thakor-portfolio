<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="churnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#31101d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#churnBg)"/>
  
  <rect x="60" y="40" width="680" height="370" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#f43f5e" stroke-opacity="0.5" stroke-width="1.5"/>
  <rect x="80" y="60" width="640" height="40" rx="8" fill="#0f172a"/>
  <text x="400" y="85" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f43f5e" text-anchor="middle">🔮 Predictive Customer Churn Machine Learning Pipeline</text>

  <!-- Confusion matrix & ROC Curve visual -->
  <rect x="80" y="120" width="300" height="270" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="100" y="145" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fb7185">Feature Importance & XGBoost</text>
  
  <rect x="100" y="165" width="260" height="20" rx="4" fill="#334155"/>
  <rect x="100" y="165" width="220" height="20" rx="4" fill="#f43f5e"/>
  <text x="110" y="179" font-family="sans-serif" font-size="10" fill="#fff">Contract Type (0.84)</text>

  <rect x="100" y="200" width="260" height="20" rx="4" fill="#334155"/>
  <rect x="100" y="200" width="180" height="20" rx="4" fill="#fb7185"/>
  <text x="110" y="214" font-family="sans-serif" font-size="10" fill="#fff">Monthly Charges (0.68)</text>

  <rect x="100" y="235" width="260" height="20" rx="4" fill="#334155"/>
  <rect x="100" y="235" width="140" height="20" rx="4" fill="#fda4af"/>
  <text x="110" y="249" font-family="sans-serif" font-size="10" fill="#000">Tenure Months (0.52)</text>

  <!-- Risk breakdown card -->
  <rect x="400" y="120" width="320" height="270" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="420" y="145" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">Model Evaluation Metrics</text>
  <text x="420" y="180" font-family="sans-serif" font-size="28" font-weight="bold" fill="#f43f5e">ROC-AUC: 0.92</text>
  <text x="420" y="210" font-family="sans-serif" font-size="13" fill="#94a3b8">Precision: 89.2% | Recall: 91.5%</text>

  <rect x="420" y="240" width="280" height="120" rx="8" fill="#1e293b"/>
  <text x="435" y="265" font-family="sans-serif" font-size="11" font-weight="bold" fill="#4ade80">Retained Customers: 82%</text>
  <text x="435" y="295" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f43f5e">High Risk Churn Alert: 18%</text>
</svg>
